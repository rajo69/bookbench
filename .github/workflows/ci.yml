name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
      # Generation never touches the network; keep any accidental model load offline too.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Only the dev extra: no sentence-transformers and no MiniLM download. Every build in the tests runs with
      # retrieval off; the one test that needs the real model skips when it is not installed.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check committed data against the manifests
        run: |
          python - <<'EOF'
          import hashlib, json, pathlib, sys
          draft = pathlib.Path("evals/datasets/bookbench/draft")
          bad = 0
          for mode in ("pilot", "full_dryrun"):
              files = json.loads((draft / mode / "manifest.json").read_text(encoding="utf-8"))["files"]
              for name in ("items.jsonl", "history.jsonl", "stats.json"):
                  got = hashlib.sha256((draft / mode / name).read_bytes()).hexdigest()
                  ok = got == files[name]["sha256"]
                  bad += not ok
                  print(f"{mode}/{name}: {'ok' if ok else 'MISMATCH ' + got}")
          sys.exit(1 if bad else 0)
          EOF

      - name: Test
        run: python -m pytest -rs
